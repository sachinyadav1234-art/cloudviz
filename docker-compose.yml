# Local full-stack environment with a REAL MongoDB instance.
#
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:5000/health
#
# This is for LOCAL development/testing convenience only. For production,
# deploy backend + frontend separately (see DELIVERY_CHECKLIST.md) and use
# MongoDB Atlas rather than this local mongo container.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cloudviz_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/cloudviz
      JWT_SECRET: local_dev_secret_change_in_production
      DEMO_MODE: "true"
      MONITORING_CRON: "*/5 * * * *"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cloudviz_mongo_data:
