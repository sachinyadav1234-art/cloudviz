server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single Page App fallback: any unknown path resolves to index.html so
    # React Router routes (e.g. /resources/64f...) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
